version: 1
scope:
  include: []
  exclude:
    - "tmp/**"
    - "img/**"
    - "doc/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "ref/tdl/**"
repowiki:
  template: "architecture"
  notes:
    - text: "ARC-05：ref/tdl 是 Git 子模块，通过 go.mod replace 引入，任何情况下禁止修改其中文件；仅允许 git submodule update --remote 同步上游。"
      author: "agent"
    - text: "Go 版本由子模块钉住为 1.25.8，go mod tidy 会自动回写 patch 版本号，不得手动修改。"
      author: "agent"
    - text: "Wails v2.11.0 为桌面壳框架，构建命令固定为 wails build -ldflags \"-s -w\" -trimpath，产出单一二进制。"
      author: "agent"
    - text: "前端使用 Vue 3.5.13 + PrimeVue 4.3.3（Aura 主题）+ Pinia + vue-router，pnpm 管理依赖。"
      author: "agent"
    - text: "Vue 组件必须采用三段式结构：<template> → <script setup lang=\"ts\"> → <style scoped>。"
      author: "agent"
    - text: "后端调用统一走 src/frontend/src/api.ts（window.go.services.* 封装），类型契约在 types.ts，修改 Go 结构体 JSON tag 后必须同步前端。"
      author: "agent"
    - text: "事件订阅在 Pinia store 的 init() 中完成，App.vue onMounted 统一调用各 store.init()。"
      author: "agent"
    - text: "主题切换默认通过 matchMedia('(prefers-color-scheme: dark)') 检测系统偏好，手动切换后持久化至 localStorage（键名 overstep-theme）。"
      author: "agent"
    - text: "所有 UI 组件须基于 CSS 变量实现主题适配，禁止硬编码颜色值；主题切换控件使用 ToggleSwitch 滑动开关。"
      author: "agent"
    - text: "登录交互采用 channel + 事件驱动模式；ChatService 常驻连接采用懒启动 + 断线重建 + jobs 通道串行化。"
      author: "agent"
  documents:
    - title: "下载引擎状态机"
      goal: "记录 src/internal/engine/ 中下载任务状态机设计（queued/running/paused/done/failed/canceled）、断点续传机制、选集下载逻辑、与 tdl core/downloader 的复用关系。"
      parent: ""
      template: "## 概述\n\n## 状态机设计\n\n## 断点续传机制\n\n## 选集下载逻辑\n\n## 与 tdl 引擎的复用关系\n\n## 关键数据结构\n\n## 时序图"
    - title: "Wails 服务层 API 契约"
      goal: "记录 src/internal/services/ 中五大服务（AuthService / ChatService / DownloadService / ScriptService / SettingsService）的方法签名、请求/响应类型、错误处理模式、与前端 api.ts 的映射关系。"
      parent: ""
      template: "## 概述\n\n## AuthService\n\n## ChatService\n\n## DownloadService\n\n## ScriptService\n\n## SettingsService\n\n## 错误处理统一模式\n\n## 前端 api.ts 映射表"
    - title: "前端页面架构"
      goal: "记录 src/frontend/src/pages/ 六大页面（Login / Chats / Tasks / Scripts / Settings / Logs）的路由配置、组件层级、Pinia store 依赖、响应式布局策略、主题适配实现。"
      parent: ""
      template: "## 概述\n\n## 路由配置\n\n## 页面组件层级\n\n## Pinia Store 依赖关系\n\n## 响应式布局策略\n\n## 主题适配实现\n\n## 公共组件复用"
    - title: "脚本引擎安全约束"
      goal: "记录 src/internal/script/ + scriptapi/ 中 Yaegi 引擎封装、沙箱策略（禁用 os/exec）、panic 恢复、10 秒超时保护、脚本文件 CRUD、契约函数提取机制。"
      parent: ""
      template: "## 概述\n\n## Yaegi 引擎封装\n\n## 沙箱安全策略\n\n## Panic 恢复与超时保护\n\n## 脚本文件 CRUD\n\n## 契约函数提取\n\n## 生命周期钩子"
    - title: "主题切换系统"
      goal: "记录 src/frontend/src/theme.ts + style.css + stores/settings.ts 中主题切换的完整实现：系统偏好检测、localStorage 持久化、CSS 变量定义、PrimeVue Aura 主题适配、ToggleSwitch 控件。"
      parent: ""
      template: "## 概述\n\n## 系统偏好检测\n\n## localStorage 持久化\n\n## CSS 变量定义\n\n## PrimeVue Aura 主题适配\n\n## ToggleSwitch 控件实现\n\n## 各页面主题适配检查点"
    - title: "事件驱动架构"
      goal: "记录 src/internal/events/ 中 Wails 事件契约定义（login:update / task:update / task:file / script:log）、事件分发机制、前后端事件流、Pinia store 中的事件订阅与清理。"
      parent: ""
      template: "## 概述\n\n## 事件契约定义\n\n## 后端事件发送\n\n## 前端事件订阅\n\n## Pinia Store 事件管理\n\n## 事件流时序图\n\n## 内存泄漏防护"
knowledgecard:
  notes:
    - text: "ARC-05 子模块只读约束：ref/tdl 是 Git 子模块，通过 go.mod replace github.com/iyear/tdl => ../ref/tdl 引入。任何情况下禁止修改 ref/tdl 内文件；需要改动 tdl 行为时，在 src/internal/ 复制改写。构建前须执行 git submodule update --init，submodule commit 变更需随本仓库一起提交。"
      author: "agent"
    - text: "Go 1.25.8 版本锁定：go.mod 中的 go 指令 patch 版本号由 ref/tdl 的 go.mod 钉住，go mod tidy 会自动回写，不得手动修改。Wails v2.11.0 为桌面壳框架版本。"
      author: "agent"
    - text: "Yaegi v0.16.1 沙箱超时保护：脚本引擎使用 Yaegi Go 解释器，沙箱禁用 os/exec 等危险包；脚本执行有 10 秒超时保护；panic 恢复机制防止脚本错误崩溃主程序。"
      author: "agent"
    - text: "bolt kv 全局唯一实例：bbolt 文件锁机制确保会话存储单例；ChatService 常驻连接采用懒启动 + 断线重建 + jobs 通道串行化，避免并发问题。"
      author: "agent"
    - text: "下载任务状态机六态：queued → running ↔ paused → done/failed/canceled；暂停 = 取消 + 保留 resume key，恢复 = 重跑 + 断点续传。"
      author: "agent"
