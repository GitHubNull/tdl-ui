<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="lh-t lh-d">
  <title id="lh-t">登录页欢迎插图</title>
  <desc id="lh-d">纸飞机沿虚线航迹飞向 Telegram 云端，媒体文件降落至本地文件夹，寓意登录后即可下载</desc>
  <defs>
    <linearGradient id="lh-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="lh-soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- 背景装饰圆（半透明，明暗主题均可用） -->
  <circle cx="240" cy="160" r="130" fill="#3B82F6" opacity="0.07"/>
  <circle cx="240" cy="160" r="92" fill="#3B82F6" opacity="0.07"/>

  <!-- 云端（Telegram 侧） -->
  <g id="cloud">
    <path d="M330 96c0-15 12-27 27-27 12 0 22 7 25 18 2-1 5-1 7-1 11 0 20 9 20 20s-9 20-20 20h-56c-11 0-20-9-20-20 0-10 8-19 17-20Z" fill="url(#lh-soft)" opacity="0.9"/>
  </g>

  <!-- 虚线航迹 -->
  <path d="M150 210 C 190 150, 260 120, 330 106" fill="none" stroke="#3B82F6" stroke-width="2.4" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.65"/>

  <!-- 纸飞机 -->
  <g transform="translate(118,182) rotate(-18)">
    <path fill="url(#lh-g)" d="M28 42 L8 6 L28 20 L48 6 Z"/>
    <path fill="#1D4ED8" opacity="0.85" d="M28 42 L28 20 L48 6 Z"/>
  </g>

  <!-- 降落的媒体文件 -->
  <g id="files">
    <g transform="translate(276,168) rotate(8)">
      <rect width="34" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
      <circle cx="12" cy="15" r="4" fill="#60A5FA"/>
      <path d="M6 32l8-9 6 6 5-4 5 7z" fill="#93C5FD"/>
    </g>
    <g transform="translate(316,196) rotate(-6)">
      <rect width="34" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
      <path d="M13 13v14l11-7z" fill="#3B82F6"/>
    </g>
  </g>

  <!-- 本地文件夹（接收端） -->
  <g id="folder" transform="translate(290,238)">
    <path d="M0 12c0-4 3-7 7-7h18l7 8h42c4 0 7 3 7 7v28c0 4-3 7-7 7H7c-4 0-7-3-7-7Z" fill="url(#lh-g)"/>
    <rect x="0" y="20" width="81" height="35" rx="6" fill="#3B82F6" opacity="0.5"/>
  </g>

  <!-- 装饰星点 -->
  <g fill="#93C5FD">
    <circle cx="96" cy="96" r="3"/>
    <circle cx="404" cy="220" r="3"/>
    <circle cx="152" cy="70" r="2"/>
    <circle cx="380" cy="60" r="2.4"/>
    <circle cx="70" cy="250" r="2.4"/>
  </g>
</svg>
